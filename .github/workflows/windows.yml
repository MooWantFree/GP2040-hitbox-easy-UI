name: Windows build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-notes.mjs --tag "$env:RELEASE_TAG" --output dist/release-notes.md
      - name: Test
        run: ./scripts/test.ps1
      - name: Build and package
        run: ./scripts/build.ps1 -Package
      - name: Upload Windows files
        uses: actions/upload-artifact@v7
        with:
          name: HitboxMap-windows-amd64
          path: |
            dist/HitboxMap.exe
            dist/HitboxMap-windows-amd64.zip
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: HitboxMap-windows-amd64
          path: dist
      - name: Create or update release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @('dist/HitboxMap.exe', 'dist/HitboxMap-windows-amd64.zip', 'dist/SHA256SUMS.txt')
          $draft = gh release view "$env:RELEASE_TAG" --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'This release is already published. Use a new version tag.' }
            gh release edit "$env:RELEASE_TAG" --title "Hitbox Map $env:RELEASE_TAG" --notes-file dist/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not update release notes.' }
            gh release upload "$env:RELEASE_TAG" @assets --clobber
          } else {
            $options = @('--draft', '--verify-tag', '--title', "Hitbox Map $env:RELEASE_TAG", '--notes-file', 'dist/release-notes.md')
            if ($env:RELEASE_TAG.Contains('-')) { $options += '--prerelease' }
            gh release create "$env:RELEASE_TAG" @assets @options
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the release draft.' }
